openapi: 3.0.0
info:
  title: VPS Management System API
  description: Next-generation VPS management system API for server, application, and database management
  version: 1.0.0
  contact:
    name: Support
    email: support@vpsmanager.local

servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://api.vpsmanager.local/api/v1
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    Server:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        ipv4:
          type: string
          format: ipv4
        ipv6:
          type: string
          format: ipv6
        provider:
          type: string
          enum: [aws, digitalocean, linode, hetzner, custom]
        status:
          type: string
          enum: [active, inactive, error, provisioning]
        specs:
          type: object
          properties:
            cpu:
              type: integer
            memory:
              type: integer
            disk:
              type: integer
        createdAt:
          type: string
          format: date-time

    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [docker, nodejs, python, go, static, php, custom]
        gitRepo:
          type: string
        gitBranch:
          type: string
        deploymentStrategy:
          type: string
          enum: [rolling, blue-green, canary]
        status:
          type: string
          enum: [running, stopped, error, deploying]
        createdAt:
          type: string
          format: date-time

    Database:
      type: object
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [postgresql, mysql, mongodb, redis]
        host:
          type: string
        port:
          type: integer
        version:
          type: string
        size:
          type: integer
        createdAt:
          type: string
          format: date-time

    Certificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        domain:
          type: string
        issuer:
          type: string
          enum: [letsencrypt, custom]
        expiresAt:
          type: string
          format: date-time
        autoRenew:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        changes:
          type: object
        ipAddress:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            statusCode:
              type: integer

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /servers:
    get:
      tags:
        - Servers
      summary: List all servers
      operationId: listServers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Server'
                  pagination:
                    type: object

    post:
      tags:
        - Servers
      summary: Create a new server
      operationId: createServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - provider
              properties:
                name:
                  type: string
                ipv4:
                  type: string
                  format: ipv4
                ipv6:
                  type: string
                  format: ipv6
                provider:
                  type: string
                  enum: [aws, digitalocean, linode, hetzner, custom]
                providerId:
                  type: string
                specs:
                  type: object
      responses:
        '201':
          description: Server created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Server'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /servers/{id}:
    get:
      tags:
        - Servers
      summary: Get server details
      operationId: getServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Server details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Server'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Servers
      summary: Update server
      operationId: updateServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                ipv4:
                  type: string
                  format: ipv4
      responses:
        '200':
          description: Server updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Server'

    delete:
      tags:
        - Servers
      summary: Delete server
      operationId: deleteServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Server deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /servers/{id}/resources:
    get:
      tags:
        - Servers
      summary: Get server resource metrics
      operationId: getServerResources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Server resources
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      cpu:
                        type: object
                      memory:
                        type: object
                      disk:
                        type: object
                      network:
                        type: object

  /audit/my-logs:
    get:
      tags:
        - Audit
      summary: Get user's audit logs
      operationId: getUserAuditLogs
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: User's audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Servers
    description: Server management endpoints
  - name: Applications
    description: Application deployment endpoints
  - name: Databases
    description: Database management endpoints
  - name: Certificates
    description: SSL certificate management
  - name: Audit
    description: Audit logging endpoints
