version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vps-management-db
    environment:
      POSTGRES_DB: nps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vps-network

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vps-management-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nps
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: development-secret-key-change-in-production
      JWT_EXPIRY: 24h
      JWT_REFRESH_EXPIRY: 7d
      API_RATE_LIMIT_WINDOW: 900000
      API_RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
    command: npm run dev
    networks:
      - vps-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vps-management-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vpsmanager.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - vps-network

volumes:
  postgres_data:

networks:
  vps-network:
    driver: bridge
